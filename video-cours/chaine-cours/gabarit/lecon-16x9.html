<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="node_modules/katex/dist/katex.min.css">
<script src="node_modules/katex/dist/katex.min.js"></script>
<style>
@font-face{font-family:"Archivo Black";src:url(node_modules/@fontsource/archivo-black/files/archivo-black-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"Space Grotesk";font-weight:500;src:url(node_modules/@fontsource/space-grotesk/files/space-grotesk-latin-500-normal.woff2) format("woff2")}
@font-face{font-family:"Space Grotesk";font-weight:700;src:url(node_modules/@fontsource/space-grotesk/files/space-grotesk-latin-700-normal.woff2) format("woff2")}
/* Tokens : clair par défaut, sombre via ?theme=sombre (guide Elearn Prépa, néo-brutal doux) */
:root{--fond:#FFF7E3;--encre:#0A0A0A;--carte:#FFFFFF;--bordure:#0A0A0A;--ombre:#0A0A0A;--marque:#10B981;--jaune:#FFD83D;--muet:#5B5B55}
:root.sombre{--fond:#141614;--encre:#F5F1E6;--carte:#1F221F;--bordure:#F5F1E6;--ombre:#10B981;--muet:#A8ADA6}
*{box-sizing:border-box}
html,body{margin:0;width:1080px;height:1920px;background:var(--fond)}
#cadre{position:relative;width:1080px;height:1920px;overflow:hidden;background:var(--fond);color:var(--encre);font-family:"Space Grotesk",sans-serif}
header{position:absolute;top:84px;left:80px;right:80px;display:flex;align-items:center;gap:22px}
header img{width:72px;height:72px;border:5px solid var(--bordure);border-radius:14px;background:var(--marque);padding:8px}
header .marque{font-family:"Archivo Black";font-size:40px;letter-spacing:-.5px}
header .matiere{margin-left:auto;font-weight:700;font-size:30px;border:4px solid var(--bordure);border-radius:10px;padding:6px 18px;background:var(--carte)}
#progres{position:absolute;top:196px;left:80px;right:80px;height:18px;border:4px solid var(--bordure);border-radius:10px;background:var(--carte);overflow:hidden}
#progres div{height:100%;width:0;background:var(--marque)}
#scene{position:absolute;top:300px;left:80px;right:80px;height:1040px;display:flex;flex-direction:column;justify-content:center;gap:40px}
.kicker{display:inline-block;align-self:flex-start;font-weight:700;font-size:34px;border:4px solid var(--bordure);border-radius:10px;padding:8px 20px;background:var(--marque);color:#0A0A0A}
h1{font-family:"Archivo Black";font-weight:400;font-size:104px;line-height:1.02;margin:0;letter-spacing:-1.5px}
h2{font-family:"Archivo Black";font-weight:400;font-size:70px;line-height:1.08;margin:0;letter-spacing:-1px}
.sous{font-size:44px;margin:0;color:var(--muet);font-weight:500}
.note{font-size:40px;margin:0;font-weight:500;color:var(--muet)}
.carte{background:var(--carte);border:6px solid var(--bordure);border-radius:16px;box-shadow:14px 14px 0 var(--ombre);padding:56px 48px;display:flex;flex-direction:column;align-items:center;gap:30px}
.tex{width:100%;text-align:center;overflow:hidden}
.tex .katex{font-size:112px}
.tex .katex-display{margin:0}
.carte .tex .katex{font-size:96px}
.cas-liste{display:flex;flex-direction:column;gap:26px}
.cas{position:relative;display:flex;align-items:center;justify-content:space-between;gap:24px;background:var(--carte);border:6px solid var(--bordure);border-radius:14px;box-shadow:10px 10px 0 var(--ombre);padding:30px 36px;opacity:.5}
.cas.actif{opacity:1;background:var(--marque);color:#0A0A0A}
.cas .cond .katex{font-size:64px}
.cas .texte{font-size:40px;font-weight:700;text-align:right}
.cas .badge{position:absolute;top:-22px;right:28px;background:var(--jaune);color:#0A0A0A;border:4px solid var(--bordure);border-radius:10px;padding:4px 16px;font-weight:700;font-size:28px}
.cas.actif .katex{color:#0A0A0A}
ol.etapes{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:26px;counter-reset:n}
ol.etapes li{counter-increment:n;display:flex;align-items:center;gap:26px;font-size:46px;font-weight:700;background:var(--carte);border:6px solid var(--bordure);border-radius:14px;box-shadow:10px 10px 0 var(--ombre);padding:28px 34px}
ol.etapes li::before{content:counter(n);font-family:"Archivo Black";flex:0 0 76px;height:76px;line-height:76px;text-align:center;border:5px solid var(--bordure);border-radius:12px;background:var(--jaune);color:#0A0A0A}
#sous{position:absolute;left:80px;right:80px;bottom:150px;min-height:220px;display:flex;align-items:center;background:var(--jaune);color:#0A0A0A;border:6px solid var(--bordure);border-radius:16px;box-shadow:12px 12px 0 var(--ombre);padding:36px 44px;font-size:46px;font-weight:700;line-height:1.3}
footer{position:absolute;bottom:56px;left:80px;right:80px;font-size:28px;font-weight:500;color:var(--muet);display:flex;justify-content:space-between}
.texte{font-size:64px;font-weight:700;line-height:1.25;text-align:left;align-items:flex-start}

/* Format 16:9 (1920x1080), pour l'app et YouTube : mise en page en paysage */
html,body{width:1920px;height:1080px}
#cadre{width:1920px;height:1080px}
header{top:34px;left:96px;right:96px;gap:20px}
header img{width:60px;height:60px;padding:7px}
header .marque{font-size:32px}
header .matiere{font-size:24px;padding:4px 16px}
#progres{top:112px;left:96px;right:96px;height:14px}
#scene{top:188px;left:96px;right:96px;height:676px;gap:18px}
h1{font-size:84px}
h2{font-size:58px}
.sous{font-size:36px}
.note{font-size:32px}
.kicker{font-size:26px;padding:6px 16px}
.carte{padding:26px 48px;gap:14px;box-shadow:10px 10px 0 var(--ombre)}
.tex .katex{font-size:100px}
.carte .tex .katex{font-size:92px}
.cas .cond .katex{font-size:52px}
.cas{padding:14px 26px}
.cas .texte{font-size:34px}
.cas-liste{gap:12px}
.cas-liste + .carte .tex .katex{font-size:68px}
.cas-liste + .carte{padding:18px 40px}
.cas-liste .cas{padding:12px 24px}
.carte .katex-display{margin:0}
ol.etapes li{font-size:36px;padding:20px 28px}
ol.etapes li::before{flex:0 0 58px;height:58px;line-height:58px;font-size:30px}
.texte{font-size:50px}
#sous{left:96px;right:96px;bottom:24px;min-height:0;font-size:38px;padding:26px 40px;box-shadow:10px 10px 0 var(--ombre)}
.anim{color:inherit;display:flex;justify-content:center}
.anim svg{height:var(--hauteur-anim,260px);width:auto;max-width:100%}
footer{display:none}
</style>
</head>
<body>
<div id="cadre">
  <header>
    <img src="logo-symbole.svg" alt="">
    <span class="marque">Elearn Prépa</span>
    <span class="matiere" id="matiere"></span>
  </header>
  <div id="progres"><div id="barre"></div></div>
  <main id="scene"></main>
  <div id="sous"></div>
  <footer><span>elearnprepa.com</span><span id="titre-lecon"></span></footer>
</div>
<script>
let D = null;
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const tex = (t, bloc = true) => `<div class="tex" data-tex="${esc(t)}" data-bloc="${bloc}"></div>`;

function gabaritBase(e) {
  switch (e.type) {
    case 'titre':
      return `<span class="kicker">${esc(e.kicker)}</span><h1>${esc(e.titre)}</h1><p class="sous">${esc(e.sous)}</p>`;
    case 'formule':
      return `<span class="kicker">${esc(e.kicker)}</span><div class="carte">${tex(e.tex)}</div>${e.note ? `<p class="note">${esc(e.note)}</p>` : ''}`;
    case 'etape':
      return `<span class="kicker">${esc(e.kicker)}</span>${e.titre ? `<h2>${esc(e.titre)}</h2>` : ''}<div class="carte">${e.tex.map(t => tex(t)).join('')}</div>`;
    case 'lignes':
      return `<span class="kicker">${esc(e.kicker)}</span><div class="carte">${e.tex.map(t => tex(t)).join('')}</div>`;
    case 'signe': {
      const cas = D.cas.map((c, i) => `<div class="cas ${i === e.actif ? 'actif' : ''}">${i === e.actif ? '<span class="badge">Cas en cours</span>' : ''}<div class="cond">${tex(c.cond, false)}</div><div class="texte">${esc(c.texte)}</div></div>`).join('');
      return `<span class="kicker">${esc(e.kicker)}</span><div class="cas-liste">${cas}</div>${e.tex.length ? `<div class="carte">${e.tex.map(t => tex(t)).join('')}</div>` : ''}`;
    }
    case 'phrase':
      return `<span class="kicker">${esc(e.kicker)}</span><div class="carte texte">${esc(e.texte)}</div>`;
    case 'recap':
      return `<span class="kicker">${esc(e.kicker)}</span><ol class="etapes">${e.etapes.map(t => `<li>${esc(t)}</li>`).join('')}</ol>`;
    default:
      throw new Error('gabarit inconnu : ' + e.type);
  }
}


const svgBoite = (corps, vb = '0 0 1000 300') => `<svg viewBox="${vb}" preserveAspectRatio="xMidYMid meet" role="img" aria-label="animation">${corps}</svg>`;
const VB_ZOOM = '300 0 400 300';
// Chaque animation reçoit le temps t (s) depuis le début de l'écran et ses options (o).
const ANIMS = {
  ressort(t, o) {
    const w = 2 * Math.PI / 2, A = 70, yEq = 170 + (o.decal || 0);
    const x = A * Math.exp(-(o.amorti ? 0.5 : 0) * t) * Math.cos(w * t);
    const yHaut = 40, yMasse = yEq + x - 50, n = 12;
    const pts = [`500,${yHaut}`];
    for (let k = 1; k < n; k++) pts.push(`${500 + (k % 2 ? 26 : -26)},${(yHaut + (yMasse - yHaut) * k / n).toFixed(1)}`);
    pts.push(`500,${yMasse}`);
    return svgBoite(
      `<line x1="330" y1="${yHaut}" x2="670" y2="${yHaut}" stroke="currentColor" stroke-width="8"/>` +
      `<line x1="330" y1="${yEq - 50}" x2="670" y2="${yEq - 50}" stroke="currentColor" stroke-dasharray="10 10" stroke-width="3" opacity=".5"/>` +
      `<polyline points="${pts.join(' ')}" fill="none" stroke="currentColor" stroke-width="5" stroke-linejoin="round"/>` +
      `<rect x="430" y="${yMasse}" width="140" height="60" fill="#FFD83D" stroke="currentColor" stroke-width="5"/>`, VB_ZOOM);
  },
  torsion(t) {
    const th = 0.6 * Math.cos(2 * Math.PI * t / 2.5), L = 220, cx = 500, cy = 150;
    const dx = L * Math.cos(th), dy = L * Math.sin(th) * 0.35;
    return svgBoite(
      `<line x1="500" y1="30" x2="500" y2="${cy}" stroke="currentColor" stroke-width="6"/>` +
      `<line x1="${cx - dx}" y1="${cy - dy}" x2="${cx + dx}" y2="${cy + dy}" stroke="currentColor" stroke-width="12" stroke-linecap="round"/>` +
      `<circle cx="${cx + dx}" cy="${cy + dy}" r="16" fill="#10B981" stroke="currentColor" stroke-width="4"/>` +
      `<circle cx="${cx - dx}" cy="${cy - dy}" r="16" fill="#10B981" stroke="currentColor" stroke-width="4"/>`);
  },
  ph(t, o) {
    const s = Math.min(1, t / 2.5), e = s * s * (3 - 2 * s);
    const pH = o.debut + (o.cible - o.debut) * e, x = 100 + 800 * pH / 14;
    return svgBoite(
      `<defs><linearGradient id="gph" x1="0" x2="1"><stop offset="0" stop-color="#E8604C"/><stop offset=".5" stop-color="#FFD83D"/><stop offset="1" stop-color="#1A75FF"/></linearGradient></defs>` +
      `<rect x="100" y="130" width="800" height="36" rx="6" fill="url(#gph)" stroke="currentColor" stroke-width="4"/>` +
      `<polygon points="${x},124 ${x - 16},96 ${x + 16},96" fill="currentColor"/>` +
      `<text x="100" y="200" font-size="30" fill="currentColor">0 acide</text>` +
      `<text x="900" y="200" font-size="30" text-anchor="end" fill="currentColor">14 basique</text>` +
      `<text x="500" y="270" font-size="44" font-weight="900" text-anchor="middle" fill="currentColor">pH = ${pH.toFixed(2).replace('.', ',')}</text>`);
  },
};


/* ——— Figures (schémas) ———
   Une figure se branche comme une animation : "anim": {"nom": "..."} sur un écran
   existant, sans toucher au texte ni à la voix. Les rayons se dessinent
   progressivement pendant les ~2 premières secondes de l'écran, puis la figure
   reste en place. Style : figure d'examen, encre du thème + couleurs Elearn. */
const prog = t => Math.max(0, Math.min(1, t / 2.2));
const interp = (x1, y1, x2, y2, p) => [x1 + (x2 - x1) * p, y1 + (y2 - y1) * p];
const trait = (x1, y1, x2, y2, p, o = {}) => {
  if (p <= 0) return '';
  const [x, y] = interp(x1, y1, x2, y2, p);
  return `<line x1="${x1}" y1="${y1}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="${o.c || 'currentColor'}" stroke-width="${o.w || 5}"${o.tiret ? ` stroke-dasharray="${o.tiret}"` : ''} stroke-linecap="round"/>`;
};
const pointe = (x, y, a, c = 'currentColor') => {
  const r = a * Math.PI / 180, L = 17, l = 8;
  const [dx, dy] = [Math.cos(r), Math.sin(r)], [px, py] = [-dy, dx];
  return `<polygon points="${x},${y} ${x - L * dx + l * px},${y - L * dy + l * py} ${x - L * dx - l * px},${y - L * dy - l * py}" fill="${c}"/>`;
};
const mot = (x, y, s, o = {}) => `<text x="${x}" y="${y}" font-size="${o.t || 29}" font-weight="700" fill="${o.c || 'currentColor'}" text-anchor="${o.a || 'middle'}">${s}</text>`;
const FIG = {
  chambre(t) {
    const p = prog(t);
    return svgBoite(
      `<line x1="120" y1="92" x2="120" y2="212" stroke="#E8604C" stroke-width="10" stroke-linecap="round"/>${pointe(120, 84, -90, '#E8604C')}` +
      mot(120, 252, 'objet') +
      `<rect x="492" y="36" width="16" height="104" fill="currentColor"/><rect x="492" y="166" width="16" height="104" fill="currentColor"/>` +
      mot(500, 296, 'petit trou', { t: 26 }) +
      `<line x1="872" y1="56" x2="872" y2="248" stroke="currentColor" stroke-width="8"/>` +
      trait(120, 92, 880, 212, p, { c: '#B8860B', w: 4 }) + trait(120, 212, 880, 92, p, { c: '#B8860B', w: 4 }) +
      (p > .85 ? `<line x1="880" y1="92" x2="880" y2="212" stroke="#10B981" stroke-width="9" stroke-linecap="round"/>${pointe(880, 220, 90, '#10B981')}` + mot(880, 262, 'image renversée', { t: 26 }) : ''));
  },
  reflexion(t) {
    const p = prog(t), p1 = Math.min(1, p * 2), p2 = Math.max(0, p * 2 - 1);
    let hach = '';
    for (let x = 210; x <= 800; x += 45) hach += `<line x1="${x}" y1="238" x2="${x - 18}" y2="258" stroke="currentColor" stroke-width="4" opacity=".55"/>`;
    return svgBoite(
      `<line x1="180" y1="238" x2="820" y2="238" stroke="currentColor" stroke-width="9"/>` + hach +
      `<line x1="500" y1="36" x2="500" y2="238" stroke="currentColor" stroke-width="4" stroke-dasharray="12 10" opacity=".7"/>` +
      mot(524, 52, 'normale', { t: 26, a: 'start' }) +
      trait(296, 62, 500, 238, p1, { c: '#E8604C', w: 6 }) + (p1 > .5 ? pointe(398, 150, 41, '#E8604C') : '') +
      trait(500, 238, 704, 62, p2, { c: '#1A75FF', w: 6 }) + (p2 > .5 ? pointe(602, 150, -41, '#1A75FF') : '') +
      (p > .45 ? `<path d="M 500 148 A 90 90 0 0 0 442 165" fill="none" stroke="currentColor" stroke-width="4"/><path d="M 558 165 A 90 90 0 0 0 500 148" fill="none" stroke="currentColor" stroke-width="4"/>` + mot(428, 150, 'i', { t: 34 }) + mot(576, 150, 'r', { t: 34 }) : '') +
      mot(280, 40, 'rayon incident', { c: '#E8604C' }) + mot(724, 40, 'rayon réfléchi', { c: '#1A75FF' }) +
      mot(500, 290, 'miroir plan', { t: 26 }));
  },
  refraction(t) {
    const p = prog(t), p1 = Math.min(1, p * 2), p2 = Math.max(0, p * 2 - 1);
    return svgBoite(
      `<rect x="56" y="150" width="510" height="132" fill="#7FC8E8" opacity=".45"/>` +
      `<line x1="56" y1="150" x2="566" y2="150" stroke="currentColor" stroke-width="6"/>` +
      mot(86, 52, 'air', { a: 'start' }) + mot(86, 262, 'eau', { a: 'start' }) +
      `<line x1="311" y1="26" x2="311" y2="282" stroke="currentColor" stroke-width="4" stroke-dasharray="12 10" opacity=".7"/>` +
      trait(176, 30, 311, 150, p1, { c: '#E8604C', w: 6 }) + (p1 > .5 ? pointe(244, 90, 41, '#E8604C') : '') +
      trait(311, 150, 398, 282, p2, { c: '#1A75FF', w: 6 }) + (p2 > .5 ? pointe(356, 218, 57, '#1A75FF') : '') +
      (p > .45 ? `<path d="M 311 84 A 66 66 0 0 0 264 103" fill="none" stroke="currentColor" stroke-width="4"/><path d="M 311 214 A 64 64 0 0 1 346 204" fill="none" stroke="currentColor" stroke-width="4"/>` + mot(240, 96, 'θ₁', { t: 32 }) + mot(366, 226, 'θ₂', { t: 32 }) : '') +
      `<rect x="664" y="48" width="272" height="220" fill="none" stroke="currentColor" stroke-width="6"/>` +
      `<rect x="670" y="140" width="260" height="122" fill="#7FC8E8" opacity=".45"/>` +
      `<line x1="700" y1="16" x2="782" y2="140" stroke="#E8604C" stroke-width="15" stroke-linecap="round"/>` +
      `<line x1="782" y1="140" x2="848" y2="256" stroke="#E8604C" stroke-width="15" stroke-linecap="round"/>` +
      mot(800, 296, 'la paille semble brisée', { t: 25 }));
  },
  prisme(t) {
    const p = prog(t), p1 = Math.min(1, p * 2), p2 = Math.max(0, p * 2 - 1);
    const coul = ['#E8604C', '#FF9F1C', '#E3C800', '#10B981', '#1A75FF', '#7B2FF7'];
    const ev = coul.map((c, k) => trait(556, 158, 884, 92 + k * 26, p2, { c, w: 5 })).join('');
    return svgBoite(
      `<path d="M 500 44 L 392 252 L 608 252 Z" fill="#FFFFFF" fill-opacity=".35" stroke="currentColor" stroke-width="6" stroke-linejoin="round"/>` +
      trait(168, 106, 447, 148, p1, { w: 7 }) + (p1 > .5 ? pointe(310, 127, 14, 'currentColor') : '') +
      trait(447, 148, 556, 158, p, { w: 6, op: 1 }) + ev +
      mot(180, 76, 'lumière blanche', { a: 'start' }) + mot(884, 66, 'spectre', { a: 'end' }));
  },
  lentilles(t) {
    const p = prog(t);
    let ray = '';
    [92, 150, 208].forEach(y => {
      ray += trait(64, y, 268, y, p, { c: '#B8860B', w: 4 }) + trait(268, y, 428, 150, p, { c: '#B8860B', w: 4 });
      ray += trait(524, y, 726, y, p, { c: '#B8860B', w: 4 }) + trait(726, y, 936, y + (150 - y) * -0.8, p, { c: '#B8860B', w: 4 }) + trait(726, y, 612, 150, Math.max(0, p - .15), { c: '#B8860B', w: 3, tiret: '8 8' });
    });
    return svgBoite(
      mot(268, 28, 'convergente') + mot(726, 28, 'divergente') +
      `<line x1="56" y1="150" x2="472" y2="150" stroke="currentColor" stroke-width="3" stroke-dasharray="10 9" opacity=".6"/>` +
      `<line x1="516" y1="150" x2="944" y2="150" stroke="currentColor" stroke-width="3" stroke-dasharray="10 9" opacity=".6"/>` +
      `<path d="M 268 44 Q 326 150 268 256 Q 210 150 268 44 Z" fill="#10B981" fill-opacity=".3" stroke="currentColor" stroke-width="5" stroke-linejoin="round"/>` +
      `<path d="M 726 44 Q 686 150 726 256 Q 766 150 726 44 Z" fill="#10B981" fill-opacity=".3" stroke="currentColor" stroke-width="5" stroke-linejoin="round"/>` +
      ray +
      `<circle cx="108" cy="150" r="8" fill="currentColor"/>` + mot(108, 192, 'F') +
      `<circle cx="428" cy="150" r="8" fill="currentColor"/>` + mot(428, 192, "F′") +
      `<circle cx="612" cy="150" r="8" fill="currentColor"/>` + mot(612, 192, "F′") +
      `<circle cx="840" cy="150" r="8" fill="currentColor"/>` + mot(840, 192, 'F'));
  },
  rayons(t) {
    const p = prog(t);
    return svgBoite(
      `<line x1="36" y1="170" x2="964" y2="170" stroke="currentColor" stroke-width="3" stroke-dasharray="10 9" opacity=".6"/>` +
      `<path d="M 520 34 Q 576 170 520 300 Q 464 170 520 34 Z" fill="#10B981" fill-opacity=".3" stroke="currentColor" stroke-width="5" stroke-linejoin="round"/>` +
      `<line x1="180" y1="170" x2="180" y2="76" stroke="#E8604C" stroke-width="10" stroke-linecap="round"/>${pointe(180, 66, -90, '#E8604C')}` +
      mot(180, 208, 'objet', { t: 26 }) +
      trait(180, 70, 520, 70, p, { c: '#B8860B', w: 4 }) + trait(520, 70, 902, 282, p, { c: '#B8860B', w: 4 }) +

    const couleur = (col, lig) => {
      if (mode === 'blocs') {
        if (lig === 8) return VIOLET;
        if (col <= 2) return ROUGE;
        if (col >= 3 && col <= 12 && lig >= 4) return DORE;
        return BLEU;

      if (lig === 8) return GRIS;

      mot(x + 136, y + 39, n + " · " + texte, { t: 18 });
    const fleche = (x1, y1, x2, y2) => trait(x1, y1, x2, y2, prog(t), { w: 3.5 }) + pointe(x2, y2, Math.round(Math.atan2(y2 - y1, x2 - x1) * 180 / Math.PI));
    return svgBoite(
      boite(52, 52, "1", "observer l'arbre") + boite(364, 52, "2", "le mode d'hérédité") + boite(676, 52, "3", "les génotypes") +
      boite(52, 178, "4", "les gamètes") + boite(364, 178, "5", "l'échiquier") + boite(676, 178, "6", "conclure") +
      fleche(330, 83, 358, 83) + fleche(642, 83, 670, 83) +
      fleche(812, 120, 812, 172) +
      fleche(670, 209, 642, 209) + fleche(358, 209, 330, 209) +
      mot(500, 160, "", { t: 18 }) +
      mot(188, 283, "une méthode en six étapes, toujours dans le même ordre", { t: 18 }));
  },
  courbe_temperature_fig(t) {
    return svgBoite(
      trait(140, 248, 880, 248, prog(t), { w: 4 }) + pointe(888, 248, 0) +
      trait(140, 248, 140, 52, prog(t), { w: 4 }) + pointe(140, 44, -90) +
      mot(896, 276, "jours du cycle", { t: 18, a: 'start' }) +
      mot(112, 150, "température", { t: 18, a: 'end' }) +
      trait(520, 248, 520, 70, prog(t), { w: 2.5, tiret: '6 5', c: '#E8604C' }) +
      mot(520, 64, "ovulation", { t: 18, c: '#E8604C' }) +
      `<path d="M 148 196 L 300 200 L 460 194 L 520 190 L 580 118 L 720 112 L 872 116" fill="none" stroke="#1A75FF" stroke-width="4.5"/>` +
      mot(300, 168, "36,5 °C", { t: 18, c: '#1A75FF' }) +
      mot(716, 88, "37,0 °C", { t: 18, c: '#1A75FF' }) +
      mot(700, 160, "le décalage thermique", { t: 18 }) +
      mot(500, 288, "un des trois signes de fertilité", { t: 19 }));
  },
  barrieres_fig(t) {
    return svgBoite(
      trait(90, 108, 330, 108, prog(t), { w: 6 }) + trait(90, 132, 330, 132, prog(t), { w: 3, c: '#B8860B' }) +
      `<circle cx="210" cy="66" r="17" fill="none" stroke="#E8604C" stroke-width="4"/>` +
      trait(210, 50, 210, 34, prog(t), { w: 3, c: '#E8604C' }) + trait(196, 56, 184, 44, prog(t), { w: 3, c: '#E8604C' }) + trait(224, 56, 236, 44, prog(t), { w: 3, c: '#E8604C' }) +
      trait(178, 160, 242, 196, prog(t), { w: 4, c: '#E8604C' }) + trait(242, 160, 178, 196, prog(t), { w: 4, c: '#E8604C' }) +
      mot(210, 238, "la peau", { t: 20 }) +
      trait(410, 132, 650, 132, prog(t), { w: 4 }) +
      `<path d="M 410 108 Q 445 88 480 108 Q 515 128 550 108 Q 585 88 620 108 Q 640 118 650 108" fill="none" stroke="#1A75FF" stroke-width="4"/>` +
      trait(448, 132, 448, 100, prog(t), { w: 3 }) + trait(500, 132, 500, 100, prog(t), { w: 3 }) + trait(552, 132, 552, 100, prog(t), { w: 3 }) + trait(604, 132, 604, 100, prog(t), { w: 3 }) +
      `<circle cx="500" cy="66" r="13" fill="none" stroke="#E8604C" stroke-width="3.5"/>` + `<circle cx="586" cy="76" r="10" fill="none" stroke="#E8604C" stroke-width="3.5"/>` +
      mot(530, 238, "les muqueuses et leurs cils", { t: 20 }) +
      `<path d="M 790 52 C 762 96, 748 116, 748 140 A 42 42 0 0 0 832 140 C 832 116, 818 96, 790 52 Z" fill="#10B981" fill-opacity=".3" stroke="#10B981" stroke-width="4"/>` +
      mot(790, 210, "les sécrétions", { t: 20 }) +
      mot(790, 238, "larmes, acidité", { t: 18 }) +
      mot(500, 284, "trois barrières naturelles", { t: 20 }));
  },
};

Object.assign(ANIMS, FIG);

function gabarit(e) {
  const style = e.anim && e.anim.hauteur ? ` style="--hauteur-anim:${e.anim.hauteur}px"` : '';
  return gabaritBase(e) + (e.anim ? `<div class="anim" id="anim"${style}></div>` : '');
}

window.chevauchement = () => {
  const s = document.getElementById('sous').getBoundingClientRect();
  return [...document.querySelectorAll('#scene > *')].some(e => {
    const r = e.getBoundingClientRect();
    return r.height > 0 && r.bottom > s.top + 1 && r.top < s.bottom - 1;
  });
};
window.charger = d => {
  D = d;
  document.getElementById('matiere').textContent = d.matiere;
  document.getElementById('titre-lecon').textContent = d.titre;
};

let ECRAN = null;
window.animer = t => {
  const el = document.getElementById('anim');
  if (!el || !ECRAN || !ECRAN.anim) return;
  const { nom, ...o } = ECRAN.anim;
  el.innerHTML = ANIMS[nom](t, o);
};

window.afficher = i => {
  const c = D.sous_titres[i];
  const e = D.ecrans[c.ecran];
  ECRAN = e;
  const scene = document.getElementById('scene');
  scene.innerHTML = gabarit(e);
  scene.querySelectorAll('[data-tex]').forEach(el =>
    katex.render(el.dataset.tex, el, { displayMode: el.dataset.bloc === 'true', throwOnError: false }));
  document.getElementById('sous').textContent = c.texte;
  document.getElementById('barre').style.width = ((i + 1) / D.sous_titres.length * 100) + '%';
};
</script>
