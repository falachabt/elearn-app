name: Build Android production (Google Play)

# Build Android de production et envoi vers Google Play, à la demande uniquement.
# Le build lui-même tourne chez EAS (certificats et clé App Store Connect API gérés par EAS) ;
# ce job ne fait que le déclencher avec le secret EXPO_TOKEN, l'attendre, puis soumettre
# le dernier build à Google Play (étape « submit », désactivable). La publication reste manuelle côté Play Console : la soumission alimente la piste production sans la publier.
# Aucun déclenchement automatique : ni push, ni pull request.

on:
  workflow_dispatch:
    inputs:
      etape:
        description: "build-submit = construire puis envoyer à Google Play ; submit = renvoyer le dernier build seulement"
        type: choice
        options: [build-submit, submit]
        default: build-submit

concurrency:
  group: android-production
  cancel-in-progress: false

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      # Même hôte public des médias TOEIC que le workflow preview (valeur par défaut du code sinon).
      EXPO_PUBLIC_CERT_MEDIA_BASE: ${{ vars.EXPO_PUBLIC_CERT_MEDIA_BASE || 'https://pub-b05c9f45ef884ab2aa345a5763751590.r2.dev' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Installer les dépendances (node_modules requis par EAS pour résoudre les plugins)
        run: npm ci
      - name: Build Android production (EAS, attente de la fin)
        if: ${{ inputs.etape == 'build-submit' }}
        run: eas build --platform android --profile production --non-interactive
      - name: Envoyer le dernier build Android à Google Play
        run: eas submit --platform android --profile production --latest --non-interactive
