# Re-rendu en masse des vidéos de cours par LOTS (voix clonée de Victoria, OmniVoice).
# Un job = un lot de cours traités à la suite (modèle et clone chargés une seule fois),
# dimensionné pour rester sous la limite de 6 h par job des machines hébergées.
# Les cours trop longs pour un lot (« gros ») restent à lancer avec « Vidéo de cours »
# (voix répartie sur 4 machines) : voir la sortie du job « plan ».
# Reprise après échec : un cours dont meta.json existe déjà sur R2 est sauté ; il suffit de relancer.
# Destination « test » (défaut) = test-victoria/ sur R2, sans toucher la base. « prod » : après accord de Benny seulement.
name: Vidéo de cours (lots)

on:
  workflow_dispatch:
    inputs:
      debut:
        description: "Index du premier cours (ordre des scripts, 0 = début)"
        default: "0"
        type: string
      fin:
        description: "Index de fin exclu (vide = jusqu'au dernier)"
        required: false
        default: ""
        type: string
      destination:
        description: "test = test-victoria/ (défaut) ; prod = remplace les vidéos en ligne (accord de Benny)"
        default: test
        type: choice
        options: [test, prod]
      etapes:
        description: "Étapes de diffusion OmniVoice (vide = défaut du modèle ; 16 = ~2x plus rapide, à valider à l'oreille)"
        required: false
        default: ""
        type: string

env:
  CHAINE_SUPABASE_URL: https://yhznbitjlzeslvudbsil.supabase.co
  CHAINE_TRAVAIL: ${{ github.workspace }}/.travail

jobs:
  plan:
    name: Plan des lots
    runs-on: ubuntu-latest
    outputs:
      lots: ${{ steps.p.outputs.lots }}
      gros: ${{ steps.p.outputs.gros }}
    steps:
      - uses: actions/checkout@v4
      - id: p
        run: |
          cd video-cours/chaine-cours
          python3 planifier_lots.py "${{ inputs.debut }}" "${{ inputs.fin }}" > plan.json
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          d = json.load(open("plan.json"))
          print("lots=" + json.dumps(d["lots"]))
          print("gros=" + ",".join(d["gros"]))
          PY
          python3 -c "import json;d=json.load(open('plan.json'));print(len(d['lots']),'lots,',len(d['gros']),'gros (à lancer avec Vidéo de cours)')"

  lot:
    name: ${{ matrix.lot.nom }} (${{ matrix.lot.minutes }} min estimées)
    needs: plan
    if: ${{ needs.plan.outputs.lots != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 355
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        lot: ${{ fromJson(needs.plan.outputs.lots) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            video-cours/chaine-cours/requirements-voix.txt
            video-cours/chaine-cours/requirements-rendu.txt
      - name: Cache du modèle OmniVoice
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: omnivoice-k2-fsa-v1
      - name: Cache Chromium (Playwright)
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-1.64.1
      - name: Installer dépendances, ffmpeg et Chromium
        run: |
          pip install -r video-cours/chaine-cours/requirements-voix.txt -r video-cours/chaine-cours/requirements-rendu.txt
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          python -m playwright install --with-deps chromium
      - name: Voix, rendu et envoi du lot
        env:
          HF_HUB_DISABLE_XET: "1"
          CHAINE_SUPABASE_KEY: ${{ secrets.CHAINE_SUPABASE_KEY }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          CHAINE_ETAPES: ${{ inputs.etapes }}
        run: |
          export CHAINE_LIMITE=$(( $(date +%s) + 5*3600 + 40*60 ))
          export CHAINE_CHROME="$(ls -d ~/.cache/ms-playwright/chromium-*/chrome-linux64/chrome | head -1)"
          cd video-cours/chaine-cours
          python lancer.py lot "${{ matrix.lot.cours }}" "${{ inputs.destination }}"
