name: Build iOS production (App Store)

# Build iOS de production et envoi vers App Store Connect : à la demande, ou
# automatiquement sur un push de main portant le marqueur [build-prod].
# Le build lui-même tourne chez EAS (certificats et clé App Store Connect API gérés par EAS) ;
# ce job ne fait que le déclencher avec le secret EXPO_TOKEN, l'attendre, puis soumettre
# le dernier build à App Store Connect (étape « submit », désactivable).
# Aucun déclenchement sur pull request : la production ne part que de main.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      etape:
        description: "build-submit = construire puis envoyer à App Store Connect ; submit = renvoyer le dernier build seulement"
        type: choice
        options: [build-submit, submit]
        default: build-submit

concurrency:
  group: ios-production
  cancel-in-progress: false

jobs:
  ios:
    # Lancement manuel (workflow_dispatch, input etape respecté), ou push sur main dont
    # le message du commit de tête contient [build-prod] : dans ce cas le job construit
    # puis envoie, comme etape = build-submit.
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[build-prod]')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      # Même hôte public des médias TOEIC que le workflow preview (valeur par défaut du code sinon).
      EXPO_PUBLIC_CERT_MEDIA_BASE: ${{ vars.EXPO_PUBLIC_CERT_MEDIA_BASE || 'https://pub-b05c9f45ef884ab2aa345a5763751590.r2.dev' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Installer les dépendances (node_modules requis par EAS pour résoudre les plugins)
        run: npm ci
      - name: Build iOS production (EAS, attente de la fin)
        if: ${{ github.event_name == 'push' || inputs.etape == 'build-submit' }}
        run: eas build --platform ios --profile production --non-interactive
      - name: Envoyer le dernier build iOS à App Store Connect
        run: eas submit --platform ios --profile production --latest --non-interactive
