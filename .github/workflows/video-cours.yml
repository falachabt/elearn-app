# Chaîne vidéo de cours (voir video-cours/METHODE.md).
# Lancement manuel : onglet Actions > « Vidéo de cours » > Run workflow,
# ou via l'API (workflow_dispatch), en donnant l'identifiant du cours.
# Le script du cours (video-cours/chaine-cours/scripts/<id>.json) doit déjà
# être commité sur la branche choisie : c'est la seule étape manuelle.
#
# Deux jobs :
#  1. voix    — les phrases sont réparties entre 4 machines en parallèle
#               (chacune génère ses clips OmniVoice, modèle mis en cache).
#  2. montage — récupère les clips, monte la chronologie, rend la vidéo,
#               produit la 720p et une planche de contact, le tout en artefact.
name: Vidéo de cours

on:
  workflow_dispatch:
    inputs:
      cours:
        description: "Identifiant du cours (ex. 5908)"
        required: true
        type: string

env:
  CHAINE_SUPABASE_URL: https://yhznbitjlzeslvudbsil.supabase.co
  CHAINE_TRAVAIL: ${{ github.workspace }}/.travail
  PARTIES: "4"

jobs:
  voix:
    name: Voix (partie ${{ matrix.partie }})
    if: ${{ inputs.cours != 'INDEX' && !startsWith(inputs.cours, 'EXTRAIRE') }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        partie: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: video-cours/chaine-cours/requirements-voix.txt
      - name: Cache du modèle OmniVoice
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: omnivoice-k2-fsa-v1
      - name: Installer les dépendances voix
        run: pip install -r video-cours/chaine-cours/requirements-voix.txt
      - name: Générer les voix de cette partie
        env:
          HF_HUB_DISABLE_XET: "1"
        run: >
          python video-cours/chaine-cours/lancer.py voix
          ${{ inputs.cours }} ${{ matrix.partie }} ${{ env.PARTIES }}
      - name: Publier les clips de cette partie
        uses: actions/upload-artifact@v4
        with:
          name: voix-${{ inputs.cours }}-${{ matrix.partie }}
          path: .travail/${{ inputs.cours }}/seg
          if-no-files-found: ignore
          retention-days: 7

  montage:
    name: Montage et rendu
    if: ${{ inputs.cours != 'INDEX' && !startsWith(inputs.cours, 'EXTRAIRE') }}
    needs: voix
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: video-cours/chaine-cours/requirements-rendu.txt
      - name: Installer les dépendances de rendu
        run: pip install -r video-cours/chaine-cours/requirements-rendu.txt
      - name: Installer ffmpeg
        # Absent de l'image du runner : le montage (silences, concat, MP4) en a besoin.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffmpeg -version | head -1
      - name: Cache Chromium (Playwright)
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-1.64.1
      - name: Installer Chromium
        run: python -m playwright install --with-deps chromium
      - name: Récupérer les clips voix
        uses: actions/download-artifact@v4
        with:
          pattern: voix-${{ inputs.cours }}-*
          path: .morceaux
      - name: Monter, rendre, compresser
        env:
          CHAINE_SUPABASE_KEY: ${{ secrets.CHAINE_SUPABASE_KEY }}
        run: |
          mkdir -p ".travail/${{ inputs.cours }}/seg"
          find .morceaux -name '*.wav' -exec cp {} ".travail/${{ inputs.cours }}/seg/" \;
          echo "Clips récupérés : $(ls ".travail/${{ inputs.cours }}/seg" | wc -l)"
          export CHAINE_CHROME="$(ls -d ~/.cache/ms-playwright/chromium-*/chrome-linux64/chrome | head -1)"
          echo "Chromium : $CHAINE_CHROME"
          cd video-cours/chaine-cours
          python lancer.py ${{ inputs.cours }}
          for f in "sorties/${{ inputs.cours }}"/cours-*-16x9.mp4; do
            base="${f%-16x9.mp4}"
            ffmpeg -v error -y -i "$f" \
              -vf scale=1280:720 -c:v libx264 -crf 27 -c:a aac -b:a 96k -movflags +faststart \
              "${base}-720p.mp4"
            ffmpeg -v error -y -ss 1 -i "$f" -frames:v 1 -q:v 3 "${base}-miniature.jpg"
            DUREE=$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$f")
            ffmpeg -v error -y -i "$f" \
              -vf "fps=25/$DUREE,tile=5x5" -frames:v 1 "${base}-planche.png"
          done
          ls -lh "sorties/${{ inputs.cours }}/"
      - name: Envoyer vers R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          ENDPOINT: https://9ae82bfac632f6d0ed7b452940e13abd.r2.cloudflarestorage.com
        run: |
          COURS="${{ inputs.cours }}"
          BASE="s3://elearn-videos/cours/$COURS"
          cd video-cours/chaine-cours
          python3 - "$COURS" <<'PYEOF'
          import json, subprocess, sys, pathlib
          cours = sys.argv[1]
          script = json.loads(pathlib.Path(f"scripts/{cours}.json").read_text())
          sorties = pathlib.Path(f"sorties/{cours}")
          parties = []
          for f in sorted(sorties.glob("cours-*-16x9.mp4")):
              nom = f.name.replace(f"cours-{cours}-", "").replace("-16x9.mp4", "").replace(".mp4", "")
              numero = int(nom.split("-")[-1]) if nom.startswith("partie-") else 1
              duree = float(subprocess.run(["ffprobe", "-v", "error", "-show_entries", "format=duration",
                                            "-of", "csv=p=0", str(f)], capture_output=True, text=True).stdout.strip())
              parties.append({"numero": numero, "duree_s": round(duree, 1)})
          meta = {"cours": int(cours), "titre": script["titre"], "matiere": script["matiere"],
                  "parties": parties,
                  "url_base": f"https://pub-1b81b49f770447bf8dde7a2a284e2c98.r2.dev/cours/{cours}"}
          (sorties / "meta.json").write_text(json.dumps(meta, ensure_ascii=False, indent=1))
          print("meta.json :", meta)
          PYEOF
          for f in "sorties/$COURS"/cours-*-16x9.mp4; do
            base="${f%-16x9.mp4}"
            case "$base" in
              *-partie-*) n="${base##*-partie-}" ;;
              *) n="1" ;;
            esac
            aws s3 cp "$f" "$BASE/partie-$n-1080.mp4" --endpoint-url "$ENDPOINT" --content-type video/mp4 --only-show-errors
            aws s3 cp "${base}-720p.mp4" "$BASE/partie-$n-720.mp4" --endpoint-url "$ENDPOINT" --content-type video/mp4 --only-show-errors
            aws s3 cp "${base}-miniature.jpg" "$BASE/partie-$n-miniature.jpg" --endpoint-url "$ENDPOINT" --content-type image/jpeg --only-show-errors
            if [ "$n" = "1" ]; then
              aws s3 cp "${base}-miniature.jpg" "$BASE/miniature.jpg" --endpoint-url "$ENDPOINT" --content-type image/jpeg --only-show-errors
            fi
          done
          aws s3 cp "sorties/$COURS/meta.json" "$BASE/meta.json" --endpoint-url "$ENDPOINT" --content-type application/json --only-show-errors
          # index.json n'est plus touché ici (course entre rendus parallèles) :
          # il est reconstruit par le job « index » (dispatch INDEX).
          echo "Envoi R2 terminé pour le cours $COURS"
      - name: Publier la vidéo
        uses: actions/upload-artifact@v4
        with:
          name: video-${{ inputs.cours }}
          path: |
            video-cours/chaine-cours/sorties/${{ inputs.cours }}/*.mp4
            video-cours/chaine-cours/sorties/${{ inputs.cours }}/*.vtt
            video-cours/chaine-cours/sorties/${{ inputs.cours }}/*-planche.png
            video-cours/chaine-cours/sorties/${{ inputs.cours }}/*-miniature.jpg
          retention-days: 14

  index:
    name: Reconstruire l'index R2
    if: ${{ inputs.cours == 'INDEX' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Reconstruire index.json depuis les meta.json du bucket
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: https://9ae82bfac632f6d0ed7b452940e13abd.r2.cloudflarestorage.com
        run: python video-cours/chaine-cours/reconstruire_index.py

  extraire:
    name: Extraire les leçons (rédaction des scripts)
    if: ${{ startsWith(inputs.cours, 'EXTRAIRE') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: video-cours/chaine-cours/requirements-rendu.txt
      - name: Installer les dépendances
        run: pip install -r video-cours/chaine-cours/requirements-rendu.txt
      - name: Extraire les leçons demandées
        env:
          CHAINE_SUPABASE_KEY: ${{ secrets.CHAINE_SUPABASE_KEY }}
          DEMANDE: ${{ inputs.cours }}
        run: |
          IDS="${DEMANDE#EXTRAIRE:}"
          cd video-cours/chaine-cours
          IFS=',' read -ra LISTE <<< "$IDS"
          for id in "${LISTE[@]}"; do
            echo "=== Extraction du cours $id"
            python lancer.py extraire "$id"
          done
          ls -R sorties | head -60
      - name: Publier les leçons extraites
        uses: actions/upload-artifact@v4
        with:
          name: lecons-${{ github.run_id }}
          path: video-cours/chaine-cours/sorties
          retention-days: 7
